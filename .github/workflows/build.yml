name: Build

on:
  push:
    branches: [main, embedded-distro]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate NDK
        run: |
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* | head -1)
          echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV
          echo "NDK: $NDK"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build hermesd
        working-directory: hermesd
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs/arm64-v8a build --release
          # cargo-ndk outputs libhermesd.so

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
